name: macOS test build

on:
  workflow_dispatch:
  push:
    branches: [release/0.1.0]

permissions:
  contents: read

concurrency:
  group: macos-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-silicon:
    name: macOS 27 Apple Silicon release
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check Apple Silicon and Xcode SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          [[ "${sdk_version%%.*}" -ge 27 ]]
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin
      - name: Check toolchain versions
        run: |
          flutter --version
          rustc --version
          cargo --version
      - name: Install Dart dependencies and analyze
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
      - name: Test native verifier
        run: cargo test --locked --manifest-path native/c2pa/Cargo.toml
      - name: Build arm64 app with ad-hoc signing
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'YES'
        run: |
          flutter config --enable-macos-arm64-only
          flutter build macos --release
      - name: Test Flutter and native FFI
        run: |
          test -f native/c2pa/target/macos/libmusha_c2pa.dylib
          flutter test
      - name: Validate and package test app
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/package-macos-test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: musha-viewer-macos-27-arm64-test
          path: dist/macos-test/
          if-no-files-found: error
          retention-days: 14
