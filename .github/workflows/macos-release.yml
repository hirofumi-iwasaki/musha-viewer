name: macOS release asset

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for retry)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  apple-silicon:
    name: macOS 27 Apple Silicon release asset
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Validate published release and version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTAG'
          import os, re, sys
          tag = os.environ['RELEASE_TAG']
          match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?', tag)
          if not match or (match.group(4) and any(p.isdigit() and len(p) > 1 and p.startswith('0') for p in match.group(4).split('.'))):
              sys.exit('Expected a valid vMAJOR.MINOR.PATCH tag, optionally with a prerelease suffix')
          version = tuple(map(int, match.group(1, 2, 3)))
          if version < (0, 2, 0) or (version == (0, 2, 0) and match.group(4)):
              sys.exit('Release must be v0.2.0 or later')
          PYTAG
          gh release view "$RELEASE_TAG" --json tagName,isDraft --jq '.tagName, .isDraft' > release-check.txt
          test "$(sed -n '1p' release-check.txt)" = "$RELEASE_TAG"
          test "$(sed -n '2p' release-check.txt)" = false
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Record checked-out commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check Apple Silicon and Xcode SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $sdk_version"
          [[ "${sdk_version%%.*}" -ge 27 ]]
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          targets: aarch64-apple-darwin
      - name: Check toolchain versions
        run: |
          flutter --version
          rustc --version
          cargo --version
      - name: Install Dart dependencies and analyze
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
      - name: Test native verifier
        run: cargo test --locked --manifest-path native/c2pa/Cargo.toml
      - name: Build arm64 app with ad-hoc signing
        env:
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: '-'
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'YES'
        run: |
          flutter config --enable-macos-arm64-only
          flutter build macos --release
      - name: Test Flutter and native FFI
        run: |
          test -f native/c2pa/target/macos/libmusha_c2pa.dylib
          flutter test
      - name: Validate and package test app
        env:
          BUILD_COMMIT: ${{ steps.commit.outputs.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/package-macos-test.sh
      - name: Package release asset with notices
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/macos-test dist/musha-viewer-macos-27-arm64-test-artifact.zip
      - name: Attach asset to published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/musha-viewer-macos-27-arm64-test-artifact.zip --clobber
