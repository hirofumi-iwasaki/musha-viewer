[package]
name = "musha_c2pa"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
c2pa = { version = "=0.91.7", default-features = false, features = ["rust_native_crypto", "fetch_remote_manifests"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
